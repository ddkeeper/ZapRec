<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 外层：深色背景 #0f172a, 28% 圆角, 边框 rgba(0,0,0,0.8) -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#0f172a" stroke="rgba(0,0,0,0.8)" stroke-width="1"/>
  <!-- 银色线框 #cbd5e1, 圆形 -->
  <rect x="25" y="25" width="14" height="14" rx="7" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <!-- 纯白核心点 #ffffff -->
  <circle cx="32" cy="32" r="2" fill="#ffffff"/>
</svg>